name: Apply restart-safe download guard fix

on:
  push:
    branches:
      - fix/pre-release-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-release-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fix
        run: node scripts/apply-download-guard-restart-fix.cjs
      - name: Validate syntax
        run: |
          node --check background.js
          node --check content.js
          node --check notification-engine.js
      - name: Run tests
        run: node --test tests/*.test.cjs
      - name: Check diff
        run: git diff --check
      - name: Commit validated fix
        run: |
          rm -f scripts/apply-download-guard-restart-fix.cjs
          rm -f .github/workflows/apply-download-guard-restart-fix.yml
          git config user.name "NYCU-Chung"
          git config user.email "chung.la13@nycu.edu.tw"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: make download redirect guard restart-safe"
          git push origin HEAD:fix/pre-release-hardening
