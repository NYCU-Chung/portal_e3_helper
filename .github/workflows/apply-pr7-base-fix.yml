name: Apply PR 7 base sanitizer fix

on:
  push:
    branches:
      - fix/pre-release-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-release-hardening

      - name: Block base elements and extend regression test
        run: |
          python3 <<'PY'
          from pathlib import Path

          content_path = Path('content.js')
          tests_path = Path('tests/security-hardening.test.cjs')
          content = content_path.read_text()
          tests = tests_path.read_text()

          old = "  'script', 'style', 'iframe', 'form', 'object', 'embed', 'applet', 'link', 'meta',\n"
          new = "  'script', 'style', 'iframe', 'form', 'object', 'embed', 'applet', 'link', 'meta', 'base',\n"
          if new not in content:
              if old not in content:
                  raise RuntimeError('blocked-tag line not found')
              content = content.replace(old, new, 1)

          marker = "  const button = fakeRichElement('button', { form: 'known-form', formaction: 'javascript:alert(1)' });\n"
          addition = "  const base = fakeRichElement('base', { href: 'https://evil.invalid/' });\n  assert.equal(context.clean(base), false);\n  assert.equal(base.removed, true);\n\n"
          if addition not in tests:
              if marker not in tests:
                  raise RuntimeError('sanitizer behavior test marker not found')
              tests = tests.replace(marker, addition + marker, 1)

          content_path.write_text(content)
          tests_path.write_text(tests)
          PY

      - name: Validate
        run: |
          node --check content.js
          node --check background.js
          node --check notification-engine.js
          node --test tests/*.test.cjs
          git diff --check

      - name: Commit validated fix
        run: |
          rm .github/workflows/apply-pr7-base-fix.yml
          git config user.name "NYCU-Chung"
          git config user.email "chung.la13@nycu.edu.tw"
          git add content.js tests/security-hardening.test.cjs .github/workflows/apply-pr7-base-fix.yml
          git commit -m "fix: block base elements in rich content"
          git push origin HEAD:fix/pre-release-hardening
