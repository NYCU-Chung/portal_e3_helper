name: Apply PR 7 review fixes

on:
  push:
    branches:
      - fix/pre-release-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-release-hardening

      - name: Apply review fixes
        run: |
          : > /tmp/apply.b64
          printf '%s' '' >> /tmp/apply.b64
          printf '%s' '' >> /tmp/apply.b64
          printf '%s' '' >> /tmp/apply.b64
          printf '%s' '  6820 chars truncated...bmNsciLm1kJyxzZW5kUg==' >> /tmp/apply.b64
          base64 -d /tmp/apply.b64 > /tmp/apply.py
          python3 /tmp/apply.py

      - name: Validate
        run: |
          node --check background.js
          node --check content.js
          node --check notification-engine.js
          node --test tests/*.test.cjs
          git diff --check

      - name: Commit validated fixes
        run: |
          rm .github/workflows/apply-pr7-review-fixes.yml
          git config user.name "NYCU-Chung"
          git config user.email "chung.la13@nycu.edu.tw"
          git add background.js content.js tests/security-hardening.test.cjs .github/workflows/apply-pr7-review-fixes.yml
          git commit -m "fix: address security review findings"
          git push origin HEAD:fix/pre-release-hardening
