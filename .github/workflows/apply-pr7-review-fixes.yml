name: Apply PR 7 review fixes

on:
  push:
    branches:
      - fix/pre-release-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-release-hardening

      - name: Apply review fixes
        run: |
          sed -i 's/pattern.subn(new_sanitizer, content, count=1)/pattern.subn(lambda _: new_sanitizer, content, count=1)/' .github/scripts/apply-pr7-review-fixes.py
          python3 .github/scripts/apply-pr7-review-fixes.py

      - name: Validate
        run: |
          node --check background.js
          node --check content.js
          node --check notification-engine.js
          node --test tests/*.test.cjs
          git diff --check

      - name: Commit validated fixes
        run: |
          rm .github/workflows/apply-pr7-review-fixes.yml
          rm .github/scripts/apply-pr7-review-fixes.py
          git config user.name "NYCU-Chung"
          git config user.email "chung.la13@nycu.edu.tw"
          git add background.js content.js tests/security-hardening.test.cjs .github/workflows/apply-pr7-review-fixes.yml .github/scripts/apply-pr7-review-fixes.py
          git commit -m "fix: address security review findings"
          git push origin HEAD:fix/pre-release-hardening
