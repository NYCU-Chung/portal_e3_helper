name: Apply PR 7 review fixes

on:
  push:
    branches:
      - fix/pre-release-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-release-hardening

      - name: Apply review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          background_path = Path('background.js')
          content_path = Path('content.js')
          tests_path = Path('tests/security-hardening.test.cjs')

          background = background_path.read_text()
          content = content_path.read_text()

          download_helpers = r'''const trackedE3Downloads = new Set();

function cancelDownloadIfFinalUrlDisallowed(downloadId, finalUrl) {
  try {
    parseAllowedE3Url(finalUrl);
    return false;
  } catch {
    trackedE3Downloads.delete(downloadId);
    chrome.downloads.cancel(downloadId, () => {
      void chrome.runtime.lastError;
      if (chrome.downloads.removeFile) {
        chrome.downloads.removeFile(downloadId, () => void chrome.runtime.lastError);
      }
    });
    console.warn(`E3 Helper: 已取消重新導向至非 E3 網域的下載 - ${finalUrl}`);
    return true;
  }
}

function validateTrackedDownload(downloadId) {
  chrome.downloads.search({ id: downloadId }, items => {
    if (chrome.runtime.lastError) return;
    const item = items?.[0];
    if (item?.finalUrl) cancelDownloadIfFinalUrlDisallowed(downloadId, item.finalUrl);
  });
}

chrome.downloads.onChanged.addListener(delta => {
  if (!trackedE3Downloads.has(delta.id)) return;
  if (delta.finalUrl?.current && cancelDownloadIfFinalUrlDisallowed(delta.id, delta.finalUrl.current)) return;
  if (delta.state?.current === 'complete' || delta.error) {
    validateTrackedDownload(delta.id);
    trackedE3Downloads.delete(delta.id);
  }
});

'''
          marker = '// 監聽來自 content script 的訊息\n'
          assert marker in background
          if 'const trackedE3Downloads = new Set();' not in background:
            background = background.replace(marker, download_helpers + marker, 1)

          old_success = '''      } else {
        console.log(`E3 Helper: 下載已開始，ID: ${downloadId}`);
        sendResponse({ success: true, downloadId: downloadId });
      }
'''
          new_success = '''      } else {
        trackedE3Downloads.add(downloadId);
        validateTrackedDownload(downloadId);
        console.log(`E3 Helper: 下載已開始，ID: ${downloadId}`);
        sendResponse({ success: true, downloadId: downloadId });
      }
'''
          if old_success in background:
            background = background.replace(old_success, new_success, 1)
          else:
            assert new_success in background

          old_fetch = '''  // 驗證初始 URL；重新導向完成後會再次驗證 response.url。
  parseAllowedE3Url(url);

  try {
    const response = await fetchWithTimeout(url, {
      method: 'GET',
      credentials: 'include'
    }, 15000); // 15 秒超時

    parseAllowedE3Url(response.url);
'''
          new_fetch = '''  // 驗證初始 URL；禁止自動重新導向，response.url 再做防禦性檢查。
  parseAllowedE3Url(url);

  try {
    const response = await fetchWithTimeout(url, {
      method: 'GET',
      credentials: 'include',
      redirect: 'error'
    }, 15000); // 15 秒超時

    parseAllowedE3Url(response.url);
'''
          if old_fetch in background:
            background = background.replace(old_fetch, new_fetch, 1)
          else:
            assert new_fetch in background

          sanitizer = r'''const RICH_CONTENT_BLOCKED_TAGS = new Set([
  'script', 'style', 'iframe', 'form', 'object', 'embed', 'applet', 'link', 'meta',
  'svg', 'math', 'template', 'button', 'input', 'select', 'textarea', 'option',
  'optgroup', 'fieldset', 'label', 'datalist', 'output'
]);
const RICH_CONTENT_BLOCKED_ATTRIBUTES = new Set([
  'id', 'name', 'form', 'formaction', 'formenctype', 'formmethod', 'formnovalidate',
  'formtarget', 'action', 'method', 'enctype', 'srcdoc', 'style', 'contenteditable',
  'autofocus'
]);

function sanitizeRichContentElement(el) {
  const tagName = String(el.tagName || '').toLowerCase();
  if (RICH_CONTENT_BLOCKED_TAGS.has(tagName)) {
    el.remove();
    return false;
  }
  Array.from(el.attributes).forEach(attr => {
    const name = attr.name.toLowerCase();
    if (name.startsWith('on') || RICH_CONTENT_BLOCKED_ATTRIBUTES.has(name) ||
        ((name === 'href' || name === 'src') && !isSafeRichContentUrl(attr.value, name))) {
      el.removeAttribute(attr.name);
    }
  });
  if (tagName === 'a' && el.getAttribute('target') === '_blank') {
    const rel = new Set((el.getAttribute('rel') || '').split(/\s+/).filter(Boolean));
    rel.add('noopener');
    rel.add('noreferrer');
    el.setAttribute('rel', [...rel].join(' '));
  }
  return true;
}

// HTML 白名單清理（用於公告/信件等 rich content）
function sanitizeHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('*').forEach(el => sanitizeRichContentElement(el));
  return div.innerHTML;
}
'''
          if 'const RICH_CONTENT_BLOCKED_TAGS' not in content:
            pattern = re.compile(r'// HTML 白名單清理（用於公告/信件等 rich content）\nfunction sanitizeHtml\(html\) \{.*?\n\}\n', re.S)
            content, count = pattern.subn(sanitizer, content, count=1)
            assert count == 1
          else:
            assert 'function sanitizeRichContentElement' in content

          tests = r'''const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const vm = require('node:vm');
const path = require('node:path');

const root = path.join(__dirname, '..');
const background = fs.readFileSync(path.join(root, 'background.js'), 'utf8');
const content = fs.readFileSync(path.join(root, 'content.js'), 'utf8');

function sliceBetween(source, start, end) {
  const a = source.indexOf(start);
  const b = source.indexOf(end, a + start.length);
  assert.notEqual(a, -1, `missing start marker: ${start}`);
  assert.notEqual(b, -1, `missing end marker: ${end}`);
  return source.slice(a, b);
}

function sliceFunction(source, marker) {
  const start = source.indexOf(marker);
  assert.notEqual(start, -1, `missing function marker: ${marker}`);
  const end = source.indexOf('\n}\n\n', start);
  assert.notEqual(end, -1, `missing function end: ${marker}`);
  return source.slice(start, end + 3);
}

function fakeElement(tagName, attributes = {}) {
  const values = new Map(Object.entries(attributes));
  return {
    tagName: tagName.toUpperCase(),
    removed: false,
    get attributes() {
      return [...values].map(([name, value]) => ({ name, value }));
    },
    remove() { this.removed = true; },
    removeAttribute(name) { values.delete(name); },
    getAttribute(name) { return values.has(name) ? values.get(name) : null; },
    setAttribute(name, value) { values.set(name, String(value)); },
    has(name) { return values.has(name); },
    value(name) { return values.get(name); }
  };
}

test('E3 URL validation requires exact HTTPS hosts', () => {
  const code = sliceBetween(background, 'const E3_ALLOWED_HOSTS', '// NYCU E3 Helper - Background Script');
  const context = { URL, Set };
  vm.createContext(context);
  vm.runInContext(`${code}\nthis.parseAllowedE3Url = parseAllowedE3Url;`, context);
  assert.equal(context.parseAllowedE3Url('https://e3.nycu.edu.tw/x').hostname, 'e3.nycu.edu.tw');
  assert.equal(context.parseAllowedE3Url('https://e3p.nycu.edu.tw/x').hostname, 'e3p.nycu.edu.tw');
  assert.throws(() => context.parseAllowedE3Url('http://e3.nycu.edu.tw/x'));
  assert.throws(() => context.parseAllowedE3Url('https://attacker-e3.nycu.edu.tw/x'));
  assert.throws(() => context.parseAllowedE3Url('https://e3.nycu.edu.tw.evil.invalid/x'));
  assert.throws(() => context.parseAllowedE3Url('https://e3.nycu.edu.tw@evil.invalid/x'));
});

test('rich-content URL policy blocks executable and unsafe data schemes', () => {
  const code = sliceBetween(content, 'function getRichContentUrlScheme', 'const RICH_CONTENT_BLOCKED_TAGS');
  const context = {};
  vm.createContext(context);
  vm.runInContext(`${code}\nthis.safe = isSafeRichContentUrl;`, context);
  assert.equal(context.safe('https://e3.nycu.edu.tw/mod/forum/view.php', 'href'), true);
  assert.equal(context.safe('/mod/forum/view.php', 'href'), true);
  assert.equal(context.safe('mailto:user@example.com', 'href'), true);
  assert.equal(context.safe('java\nscript:alert(1)', 'href'), false);
  assert.equal(context.safe(' data:text/html,<script>alert(1)</script>', 'href'), false);
  assert.equal(context.safe('data:image/png;base64,AAAA', 'src'), true);
  assert.equal(context.safe('data:image/svg+xml,<svg/>', 'src'), false);
});

test('rich-content sanitizer strips form controls, clobbering identifiers, and unsafe links', () => {
  const urlPolicy = sliceBetween(content, 'function getRichContentUrlScheme', 'const RICH_CONTENT_BLOCKED_TAGS');
  const elementPolicy = sliceBetween(content, 'const RICH_CONTENT_BLOCKED_TAGS', '// HTML 白名單清理');
  const context = { Set };
  vm.createContext(context);
  vm.runInContext(`${urlPolicy}\n${elementPolicy}\nthis.clean = sanitizeRichContentElement;`, context);

  const button = fakeElement('button', { form: 'known-form', formaction: 'javascript:alert(1)' });
  assert.equal(context.clean(button), false);
  assert.equal(button.removed, true);

  const div = fakeElement('div', { id: 'e3-helper-add-assignment-form', name: 'helper', form: 'host-form' });
  assert.equal(context.clean(div), true);
  assert.equal(div.has('id'), false);
  assert.equal(div.has('name'), false);
  assert.equal(div.has('form'), false);

  const anchor = fakeElement('a', { href: 'java\nscript:alert(1)', target: '_blank', rel: 'ugc' });
  assert.equal(context.clean(anchor), true);
  assert.equal(anchor.has('href'), false);
  assert.match(anchor.value('rel'), /\bugc\b/);
  assert.match(anchor.value('rel'), /\bnoopener\b/);
  assert.match(anchor.value('rel'), /\bnoreferrer\b/);

  const safeAnchor = fakeElement('a', { href: 'https://e3.nycu.edu.tw/course/view.php?id=1' });
  context.clean(safeAnchor);
  assert.equal(safeAnchor.value('href'), 'https://e3.nycu.edu.tw/course/view.php?id=1');
});

test('E3 content fetch forbids redirects and validates response URL before reading the body', async () => {
  const urlPolicy = sliceBetween(background, 'const E3_ALLOWED_HOSTS', '// NYCU E3 Helper - Background Script');
  const fetchContent = sliceFunction(background, 'async function fetchContentFromE3');
  let response;
  let seenOptions;
  let bodyReads = 0;
  const context = {
    URL,
    Set,
    console: { log() {}, error() {} },
    fetchWithTimeout: async (_url, options) => {
      seenOptions = options;
      return response;
    }
  };
  vm.createContext(context);
  vm.runInContext(`${urlPolicy}\n${fetchContent}\nthis.fetchContentFromE3 = fetchContentFromE3;`, context);

  response = {
    url: 'https://e3.nycu.edu.tw/mod/forum/view.php',
    ok: true,
    status: 200,
    text: async () => { bodyReads++; return '<p>ok</p>'; }
  };
  assert.equal(await context.fetchContentFromE3('https://e3.nycu.edu.tw/mod/forum/view.php'), '<p>ok</p>');
  assert.equal(seenOptions.redirect, 'error');
  assert.equal(seenOptions.credentials, 'include');
  assert.equal(bodyReads, 1);

  response = {
    url: 'https://evil.invalid/redirected',
    ok: true,
    status: 200,
    text: async () => { bodyReads++; return 'evil'; }
  };
  await assert.rejects(context.fetchContentFromE3('https://e3.nycu.edu.tw/mod/forum/view.php'), /無法抓取內容/);
  assert.equal(bodyReads, 1, 'off-host response body must not be read');
});

test('download final URL guard cancels and removes off-domain downloads', () => {
  const urlPolicy = sliceBetween(background, 'const E3_ALLOWED_HOSTS', '// NYCU E3 Helper - Background Script');
  const guardCode = sliceBetween(background, 'const trackedE3Downloads', '// 監聽來自 content script 的訊息');
  const cancelled = [];
  const removed = [];
  const context = {
    URL,
    Set,
    console: { warn() {} },
    chrome: {
      runtime: { lastError: null },
      downloads: {
        cancel(id, callback) { cancelled.push(id); callback(); },
        removeFile(id, callback) { removed.push(id); callback(); },
        search(_query, callback) { callback([]); },
        onChanged: { addListener() {} }
      }
    }
  };
  vm.createContext(context);
  vm.runInContext(`${urlPolicy}\n${guardCode}\nthis.guard = cancelDownloadIfFinalUrlDisallowed;`, context);

  assert.equal(context.guard(7, 'https://e3.nycu.edu.tw/pluginfile.php/1/file.pdf'), false);
  assert.deepEqual(cancelled, []);
  assert.equal(context.guard(8, 'https://evil.invalid/file.pdf'), true);
  assert.deepEqual(cancelled, [8]);
  assert.deepEqual(removed, [8]);
});

test('manifest release metadata stays hardened for v2.3.0', () => {
  const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
  assert.equal(manifest.minimum_chrome_version, '93');
  assert.equal(manifest.version, '2.3.0');
  assert.equal(manifest.host_permissions.includes('http://localhost:11434/*'), false);
});
'''

