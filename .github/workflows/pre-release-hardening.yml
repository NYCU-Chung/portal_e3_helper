name: Apply pre-release hardening

on:
  push:
    branches:
      - fix/pre-release-hardening

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-release-hardening
          fetch-depth: 0

      - name: Apply hardening fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, repl, flags=0):
              text = read(path)
              new, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern}')
              write(path, new)

          # background.js: centralize exact E3 URL validation.
          replace_once(
              'background.js',
              "const ui = E3HelperI18n.template;\n",
              "const ui = E3HelperI18n.template;\n"
              "const E3_ALLOWED_HOSTS = new Set(['e3.nycu.edu.tw', 'e3p.nycu.edu.tw']);\n"
              "function parseAllowedE3Url(value) {\n"
              "  const url = new URL(String(value || ''));\n"
              "  if (url.protocol !== 'https:' || !E3_ALLOWED_HOSTS.has(url.hostname)) {\n"
              "    throw new Error('URL not from allowed E3 domain');\n"
              "  }\n"
              "  return url;\n"
              "}\n"
          )

          # Serialize background log persistence to avoid read-modify-write loss.
          marker = "};\n\n// 儲存日誌到 storage 並通知 content script"
          log_queue = "};\n\nlet backgroundLogStorageQueue = Promise.resolve();\n\nfunction queueBackgroundLog(entry) {\n  const operation = backgroundLogStorageQueue.then(() => new Promise(resolve => {\n    chrome.storage.local.get(['backgroundLogs'], result => {\n      if (chrome.runtime.lastError) {\n        resolve();\n        return;\n      }\n      const logs = result.backgroundLogs || [];\n      logs.push(entry);\n      if (logs.length > 200) logs.splice(0, logs.length - 200);\n      chrome.storage.local.set({ backgroundLogs: logs }, () => {\n        void chrome.runtime.lastError;\n        resolve();\n      });\n    });\n  }));\n  backgroundLogStorageQueue = operation.catch(() => {});\n}\n\n// 儲存日誌到 storage 並通知 content script"
          replace_once('background.js', marker, log_queue)

          regex_once(
              'background.js',
              r"  // 儲存到 chrome\.storage（供後續查詢）\n  chrome\.storage\.local\.get\(\['backgroundLogs'\], \(result\) => \{.*?\n  \}\);\n\n  // 廣播日誌到有 E3 Helper sidebar 的 tabs",
              "  // 儲存到 chrome.storage（供後續查詢）\n  queueBackgroundLog({\n    type,\n    args: serializedArgs,\n    timestamp: Date.now(),\n    time: new Date().toLocaleTimeString('zh-TW', { hour12: false })\n  });\n\n  // 廣播日誌到有 E3 Helper sidebar 的 tabs",
              flags=re.S
          )

          # Download requests: exact HTTPS host allowlist and Windows/POSIX path traversal defense.
          regex_once(
              'background.js',
              r"    // 驗證下載 URL 域名\n    const downloadAllowedDomains = \['e3\.nycu\.edu\.tw', 'e3p\.nycu\.edu\.tw'\];\n    try \{\n      const urlObj = new URL\(request\.url\);\n      if \(!downloadAllowedDomains\.some\(d => urlObj\.hostname\.endsWith\(d\)\)\) \{\n        sendResponse\(\{ success: false, error: 'Download URL not from allowed domain' \}\);\n        return true;\n      \}\n    \} catch \{\n      sendResponse\(\{ success: false, error: 'Invalid URL' \}\);\n      return true;\n    \}",
              "    // 僅允許官方 E3 HTTPS 主機。\n    try {\n      parseAllowedE3Url(request.url);\n    } catch {\n      sendResponse({ success: false, error: 'Download URL not from allowed domain' });\n      return true;\n    }"
          )
          replace_once(
              'background.js',
              "if (request.filename && (request.filename.includes('..') || request.filename.includes('/'))) {",
              "if (request.filename && (request.filename.includes('..') || /[\\\\/]/.test(request.filename))) {"
          )

          # Content fetches: exact initial URL and final redirect URL validation.
          regex_once(
              'background.js',
              r"  // 驗證 URL 域名\n  const fetchAllowedDomains = \['e3\.nycu\.edu\.tw', 'e3p\.nycu\.edu\.tw'\];\n  try \{\n    const urlObj = new URL\(url\);\n    if \(!fetchAllowedDomains\.some\(d => urlObj\.hostname\.endsWith\(d\)\)\) \{\n      throw new Error\('URL not from allowed E3 domain'\);\n    \}\n  \} catch \(e\) \{ throw e; \}",
              "  // 驗證初始 URL；重新導向完成後會再次驗證 response.url。\n  parseAllowedE3Url(url);"
          )
          replace_once(
              'background.js',
              "    }, 15000); // 15 秒超時\n\n    if (!response.ok) {",
              "    }, 15000); // 15 秒超時\n\n    parseAllowedE3Url(response.url);\n    if (!response.ok) {"
          )

          # Defense in depth for assignment links opened by the background worker.
          replace_once(
              'background.js',
              "chrome.tabs.create({ url: assignment.url });",
              "try {\n        chrome.tabs.create({ url: parseAllowedE3Url(assignment.url).href });\n      } catch (error) {\n        console.warn('E3 Helper: 阻擋非 E3 作業連結', error.message);\n      }"
          )

          # content.js: harden rich HTML URL handling and target=_blank isolation.
          sanitizer_old = '''// HTML 白名單清理（用於公告/信件等 rich content）
          function sanitizeHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            // 移除危險標籤
            div.querySelectorAll('script,style,iframe,form,object,embed,applet,link,meta,base,svg').forEach(el => el.remove());
            // 移除所有 on* 事件屬性和危險屬性
            div.querySelectorAll('*').forEach(el => {
              [...el.attributes].forEach(attr => {
                if (attr.name.startsWith('on') || attr.name === 'srcdoc') el.removeAttribute(attr.name);
                if (attr.name === 'href' && el.getAttribute('href')?.startsWith('javascript:')) el.setAttribute('href', '#');
              });
            });
            return div.innerHTML;
          }'''.replace('          ', '')

          sanitizer_new = r'''function getRichContentUrlScheme(value) {
            const normalized = String(value || '').trim().replace(/[\u0000-\u0020\u007f]+/g, '');
            const match = normalized.match(/^([a-z][a-z0-9+.-]*):/i);
            return match ? match[1].toLowerCase() : '';
          }

          function isSafeRichContentUrl(value, attributeName) {
            const scheme = getRichContentUrlScheme(value);
            if (!scheme) return true;
            if (attributeName === 'href') return ['http', 'https', 'mailto', 'tel'].includes(scheme);
            if (attributeName === 'src') {
              if (scheme === 'http' || scheme === 'https') return true;
              if (scheme === 'data') {
                return /^data:image\/(?:png|jpeg|gif|webp);base64,/i.test(String(value).trim());
              }
            }
            return false;
          }

          // HTML 白名單清理（用於公告/信件等 rich content）
          function sanitizeHtml(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            div.querySelectorAll('script,style,iframe,form,object,embed,applet,link,meta,base,svg,math,template').forEach(el => el.remove());
            div.querySelectorAll('*').forEach(el => {
              [...el.attributes].forEach(attr => {
                const name = attr.name.toLowerCase();
                if (name.startsWith('on') || name === 'srcdoc') {
                  el.removeAttribute(attr.name);
                  return;
                }
                if ((name === 'href' || name === 'src') && !isSafeRichContentUrl(attr.value, name)) {
                  if (name === 'href') el.setAttribute(attr.name, '#');
                  else el.removeAttribute(attr.name);
                }
              });
              if (el.tagName === 'A' && (el.getAttribute('target') || '').toLowerCase() === '_blank') {
                const rel = new Set((el.getAttribute('rel') || '').split(/\s+/).filter(Boolean));
                rel.add('noopener');
                rel.add('noreferrer');
                el.setAttribute('rel', [...rel].join(' '));
              }
            });
            return div.innerHTML;
          }'''.replace('          ', '')
          replace_once('content.js', sanitizer_old, sanitizer_new)

          # Manifest: release bump and remove stale localhost permission.
          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '2.3.0'
          manifest['host_permissions'] = [
              item for item in manifest.get('host_permissions', [])
              if item != 'http://localhost:11434/*'
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Active docs must match minimum Chrome version.
          for filename in ('README.md', 'README.en.md', 'INSTALL.md'):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('Chrome 88+', 'Chrome 93+').replace('Edge 88+', 'Edge 93+')
              path.write_text(text, encoding='utf-8')

          # Add the missing license promised by the README.
          license_text = '''MIT License

          Copyright (c) 2025-2026 Bing-Jyun Chung

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          '''.replace('          ', '')
          Path('LICENSE').write_text(license_text, encoding='utf-8')

          # Current Web Store listing: remove stale v2.1/Gemini-only claims.
          store = '''======================================
          Chrome Web Store 擴充功能說明 v2.3
          ======================================

          【簡短描述】
          強化 NYCU E3：作業倒數、公告信件、成績、教材下載、雙語介面、AI 摘要與每日總覽、可自訂截止提醒。

          【詳細描述】
          NYCU E3 Helper 是為陽明交通大學學生設計的 E3 輔助工具，可在瀏覽器側邊欄集中處理課程資訊與常用操作。

          ========== 主要功能 ==========

          📝 作業管理
          ・同步 E3 作業與截止時間，顯示倒數與課程名稱
          ・支援手動新增、編輯、刪除與繳交狀態管理
          ・快速前往 E3 作業頁面

          📢 公告與信件
          ・整合各課程公告與 dcpcmail 信件
          ・支援未讀狀態、篩選與內容預覽
          ・定時同步只會重用已開啟的 E3 分頁；E3 未開啟時會跳過，不會背景打開登入頁

          📊 成績與教材
          ・查詢課程成績與項目資訊
          ・掃描課程教材，支援個別下載與 ZIP 批次下載

          🌐 介面與外觀
          ・繁體中文 / English 介面
          ・Light / Dark / System 外觀設定

          🤖 摘要、每日總覽與翻譯（選配）
          ・AI 摘要可選 Gemini 或 OpenAI，使用者自行提供對應 API Key
          ・今日總覽可整理當日公告與信件，並保留來源連結與本機快取
          ・中英翻譯使用 Google Translate，不需要 Gemini / OpenAI API Key
          ・AI 功能可完全停用

          🔔 通知與截止提醒
          ・可開關桌面通知、更新通知與即時 / 每日通知方式
          ・可設定多個作業截止提醒時距
          ・背景佇列會避免重複通知，並略過已繳交、已移除、已變更或已過期的作業提醒

          ========== 隱私與安全 ==========

          ・課程資料、設定、通知狀態與 API Key 儲存在瀏覽器本機
          ・不販售或上傳使用者資料到本專案自己的伺服器
          ・E3 資料只向 NYCU E3 官方 HTTPS 主機存取
          ・AI 摘要啟用時，必要文字會傳送至使用者選擇的 Gemini 或 OpenAI
          ・翻譯時，待翻譯文字會傳送至 Google Translate
          ・OpenAI Responses API 使用 store:false
          ・專案開源，可自行檢視程式碼

          ========== 第三方服務 ==========

          ・NYCU E3：e3.nycu.edu.tw、e3p.nycu.edu.tw（核心功能）
          ・Google Gemini：generativelanguage.googleapis.com（AI 摘要，選配）
          ・OpenAI：api.openai.com（AI 摘要，選配）
          ・Google Translate：translate.googleapis.com（翻譯功能）

          ========== v2.3 重點 ==========

          ・新增繁中 / 英文介面與 Light / Dark / System 外觀
          ・新增 Gemini / OpenAI 可選摘要與每日總覽
          ・新增可自訂桌面通知與多組截止提醒
          ・定時公告 / 信件同步不再自行開啟 E3 背景分頁
          ・加強 E3 URL 驗證、內容 HTML 清理與背景日誌一致性
          '''.replace('          ', '')
          Path('STORE_DESCRIPTION.txt').write_text(store, encoding='utf-8')

          # Release changelog entry, preserving historical entries verbatim.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## [2.3.0]' not in text:
              entry = '''## [2.3.0] - 2026-10-11

          ### Added
          - Light, Dark, and System appearance preferences plus Traditional Chinese / English interface selection.
          - Selectable Gemini / OpenAI summaries with cached daily digest and source links.
          - Configurable desktop notifications and assignment deadline reminder offsets.

          ### Changed
          - Scheduled announcement/message sync now reuses an existing E3 tab and skips when E3 is closed instead of opening a background login tab.
          - Google Translate remains separate from the selected AI summary provider.

          ### Security
          - Require exact HTTPS E3 hosts for downloads and content fetches, including final redirect validation.
          - Harden rich-content URL sanitization and isolate `target="_blank"` links.
          - Serialize background log persistence and remove an unused localhost host permission.

          '''.replace('          ', '')
              first_heading_end = text.find('\n', text.find('# ')) + 1
              text = text[:first_heading_end] + '\n' + entry + text[first_heading_end:]
              changelog.write_text(text, encoding='utf-8')

          # Regression coverage for the new URL policy and source-level wiring.
          tests = r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const path = require('node:path');

          const root = path.join(__dirname, '..');
          const background = fs.readFileSync(path.join(root, 'background.js'), 'utf8');
          const content = fs.readFileSync(path.join(root, 'content.js'), 'utf8');

          function sliceBetween(source, start, end) {
            const a = source.indexOf(start);
            const b = source.indexOf(end, a + start.length);
            assert.notEqual(a, -1, `missing start marker: ${start}`);
            assert.notEqual(b, -1, `missing end marker: ${end}`);
            return source.slice(a, b);
          }

          test('E3 URL validation requires exact HTTPS hosts', () => {
            const code = sliceBetween(background, 'const E3_ALLOWED_HOSTS', '// NYCU E3 Helper - Background Script');
            const context = { URL, Set };
            vm.createContext(context);
            vm.runInContext(`${code}\nthis.parseAllowedE3Url = parseAllowedE3Url;`, context);
            assert.equal(context.parseAllowedE3Url('https://e3.nycu.edu.tw/x').hostname, 'e3.nycu.edu.tw');
            assert.equal(context.parseAllowedE3Url('https://e3p.nycu.edu.tw/x').hostname, 'e3p.nycu.edu.tw');
            assert.throws(() => context.parseAllowedE3Url('http://e3.nycu.edu.tw/x'));
            assert.throws(() => context.parseAllowedE3Url('https://attacker-e3.nycu.edu.tw/x'));
            assert.throws(() => context.parseAllowedE3Url('https://e3.nycu.edu.tw.evil.invalid/x'));
            assert.throws(() => context.parseAllowedE3Url('https://e3.nycu.edu.tw@evil.invalid/x'));
          });

          test('rich-content URL policy blocks executable and unsafe data schemes', () => {
            const code = sliceBetween(content, 'function getRichContentUrlScheme', '// HTML 白名單清理');
            const context = {};
            vm.createContext(context);
            vm.runInContext(`${code}\nthis.safe = isSafeRichContentUrl;`, context);
            assert.equal(context.safe('https://e3.nycu.edu.tw/mod/forum/view.php', 'href'), true);
            assert.equal(context.safe('/mod/forum/view.php', 'href'), true);
            assert.equal(context.safe('mailto:user@example.com', 'href'), true);
            assert.equal(context.safe('java\nscript:alert(1)', 'href'), false);
            assert.equal(context.safe(' data:text/html,<script>alert(1)</script>', 'href'), false);
            assert.equal(context.safe('data:image/png;base64,AAAA', 'src'), true);
            assert.equal(context.safe('data:image/svg+xml,<svg/>', 'src'), false);
          });

          test('hardening is wired into downloads, redirects, links, and manifest permissions', () => {
            assert.ok(background.includes('parseAllowedE3Url(request.url);'));
            assert.ok(background.includes('parseAllowedE3Url(response.url);'));
            assert.ok(background.includes("/[\\\\/]/.test(request.filename)"));
            assert.ok(content.includes("rel.add('noopener')"));
            assert.ok(content.includes("rel.add('noreferrer')"));
            const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
            assert.equal(manifest.minimum_chrome_version, '93');
            assert.equal(manifest.version, '2.3.0');
            assert.equal(manifest.host_permissions.includes('http://localhost:11434/*'), false);
          });
          '''.replace('          ', '')
          Path('tests/security-hardening.test.cjs').write_text(tests, encoding='utf-8')
          PY

      - name: Validate JavaScript and tests
        run: |
          node --check background.js
          node --check content.js
          node --check notification-engine.js
          node --test tests/*.test.cjs
          git diff --check

      - name: Commit validated hardening
        run: |
          rm .github/workflows/pre-release-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden pre-release security paths [hardening-applied]"
          git push origin HEAD:fix/pre-release-hardening
